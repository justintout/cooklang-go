name: Release

on:
  push:
    tags:
      - 'v*'

# gh release create needs write access, which the default token does not have.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # the tag annotation is read from local git, and a shallow clone does
        # not fetch it
        fetch-depth: 0
    - name: create the release from the tag annotation
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
