name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # The previous single negative pattern under paths kept this workflow
    # from running on main; the equivalent paths-ignore does not. Path
    # filters are not evaluated for tag pushes, so tags still get here.
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: run tests
      # '^[^TestCanonical]' is a negated character class, and every test name
      # starts with a letter in it, so the old -run selected nothing.
      run: go test -skip '^TestCanonical$' ./...

  canonical:
    uses: ./.github/workflows/canonical.yaml

  # Publishing is gated on both suites, so a tag whose tests fail does not
  # produce a release.
  release:
    needs: [ test, canonical ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        # the tag annotation is read from local git, and a shallow clone does
        # not fetch it
        fetch-depth: 0
    - name: create the release from the tag annotation
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
