name: Canonical Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Also called by ci.yaml, which gates a release on this suite. Keeping it in
  # its own file is what gives it a badge of its own; badges are per workflow,
  # not per job.
  workflow_call:

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: canonical tests
      run: go test -run 'TestCanonical' ./...
