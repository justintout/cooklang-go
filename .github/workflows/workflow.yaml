name: CI

on:
  push:
    branches: [ main ]
    # The previous single negative pattern under paths kept this workflow
    # from running on main; the equivalent paths-ignore does not.
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: run tests
      # '^[^TestCanonical]' is a negated character class, and every test name
      # starts with a letter in it, so the old -run selected nothing.
      run: go test -skip '^TestCanonical$' ./...
